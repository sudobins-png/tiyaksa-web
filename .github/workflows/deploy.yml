name: Deploy to VPS

on:
  push:
    branches: [main]

# Deploys are idempotent — every run pulls whatever :latest points at — so a
# newer push supersedes an older in-flight run. Cancelling it keeps two deploys
# off the VPS at once, which is what wedged the SSH session on run #102.
concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/tiyaksa:latest

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Without these the action waits indefinitely: a stuck session used to
          # hang the job until the 6h default limit instead of failing fast.
          timeout: 30s
          command_timeout: 8m
          script: |
            cd /root/tiyaksa
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
