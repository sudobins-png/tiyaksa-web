version: "3.7"

services:
  tiyaksa:
    image: ghcr.io/${GITHUB_REPO}/tiyaksa:latest
    restart: always
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Outbound to Telegram's IP range is blocked from this VPS's network — see
      # lib/server/telegram.ts. Relays through an HTTP proxy on a second VPS
      # instead. Unset (or blank) falls back to a direct connection.
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL:-}
      # Headless WordPress blog backend. Must be an internal address (this VPS
      # can't hairpin back to its own public domain — see lib/server/wordpress.ts)
      - WORDPRESS_API_URL=${WORDPRESS_API_URL:-http://127.0.0.1:8091/blog/wp-json}
    volumes:
      # Persists lib/server/leadLog.ts's JSONL lead log across redeploys —
      # the container's own filesystem is discarded on every `up -d`.
      - ./data:/app/data
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tiyaksa.rule=Host(`tiyaksa.ru`)"
      - "traefik.http.routers.tiyaksa.entrypoints=websecure"
      - "traefik.http.routers.tiyaksa.tls.certresolver=mytlschallenge"
      - "traefik.http.services.tiyaksa.loadbalancer.server.port=3000"
      # www.tiyaksa.ru had no router at all — it fell through to Traefik's
      # self-signed default cert and a 404. Same pattern already used for
      # бартеравто.рф's own www redirect on this VPS. The router matches an
      # exact Host, so the unescaped "." in the regex only ever sees
      # www.tiyaksa.ru — no YAML/regex backslash-escaping ambiguity.
      - "traefik.http.routers.tiyaksa-www.rule=Host(`www.tiyaksa.ru`)"
      - "traefik.http.routers.tiyaksa-www.entrypoints=websecure"
      - "traefik.http.routers.tiyaksa-www.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.tiyaksa-www.service=tiyaksa"
      - "traefik.http.routers.tiyaksa-www.middlewares=tiyaksa-www-redirect"
      - "traefik.http.middlewares.tiyaksa-www-redirect.redirectregex.regex=^https://www.tiyaksa.ru/(.*)"
      - "traefik.http.middlewares.tiyaksa-www-redirect.redirectregex.replacement=https://tiyaksa.ru/$${1}"
      - "traefik.http.middlewares.tiyaksa-www-redirect.redirectregex.permanent=true"

networks:
  n8n_default:
    external: true
